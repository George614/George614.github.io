# Site settings. Every value here is read by a layout, an include or a plugin.
title: Zhizhuo Yang
description: AI Research Scientist at WRITER, working on reinforcement learning and post-training for LLM agents.
url: https://George614.github.io
baseurl: ""
lang: en
author: Zhizhuo Yang

email: yangzhizhuo@gmail.com
github_username: George614
linkedin_username: zhizhuo-yang
scholar_userid: OA2-BIsAAAAJ
google_analytics: G-Z9YMBS9KFE
cv_pdf: /assets/pdf/Academic_CV_Zhizhuo_Yang_Nov2026.pdf

include: [_pages]
exclude:
  - docs
  - tests
  - node_modules
  - package.json
  - package-lock.json
  - playwright.config.js
  - lighthouserc.json
  - README.md
  - CLAUDE.md
  - LICENSE
  - test-results
  - playwright-report
  - .lighthouseci
  - scripts
  # Original images stay in the repository as sources; the site serves only their resized WebP
  # copies, which have the camera metadata (including any GPS position) stripped.
  - "assets/photography/*/*.JPG"
  - "assets/photography/*/*.jpg"
  - "assets/img/*.jpg"
  - "assets/img/*.png"
  - "assets/img/research/*.jpg"
  - "assets/img/research/*.png"

collections:
  research:
    output: true
    permalink: /research/:name/
  news:
    output: false

defaults:
  - scope: { path: "", type: research }
    values: { layout: project, nav_key: research }
  - scope: { path: _pages }
    values: { layout: page }
  - scope: { path: assets }
    values: { sitemap: false }

plugins:
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-minifier
  - jekyll-imagemagick
  - jekyll-redirect-from
  - jekyll-seo-tag

sass:
  style: compressed

jekyll-minifier:
  exclude: [robots.txt]
  # Sass already compresses the stylesheet, and the minifier's own CSS compressor breaks var() inside calc().
  compress_css: false

# Resized WebP copies of every image, used by _includes/picture.html.
imagemagick:
  enabled: true
  widths: [480, 800, 1400, 2000]
  input_directories: [assets/img/, assets/photography/]
  input_formats: [".jpg", ".jpeg", ".png"]
  output_formats:
    webp: "-auto-orient -strip -quality 82"

scholar:
  last_name: [Yang]
  first_name: [Zhizhuo, Z.]
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]
  replace_strings: true
  join_strings: true
  group_by: year
  group_order: descending
  bibliography_group_tag: h3
  bibliography_list_tag: ul
  bibliography_class: pub-list
  bibliography_item_attributes: { class: pub }

# Custom BibTeX keys that are hidden from the BibTeX shown on the publications page.
filtered_bibtex_keywords: [abbr, abstract, arxiv, bibtex_show, html, pdf, selected, supp, blog,
                           code, poster, slides, website, preview, altmetric, group, project]

redirect_from:
  json: false
