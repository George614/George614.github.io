{% if site.enable_tooltips %}
  <!-- Enable Tooltips -->
  <script type="text/javascript">
  $(function () {$('[data-toggle="tooltip"]').tooltip()})
  </script>
{%- endif %}

{%- if site.enable_medium_zoom %}
  <!-- Medium Zoom JS -->
  <script defer src="https://cdn.jsdelivr.net/npm/medium-zoom@{{ site.medium_zoom.version }}/dist/medium-zoom.min.js" integrity="{{ site.medium_zoom.integrity }}" crossorigin="anonymous"></script>
  <script defer src="{{ '/assets/js/zoom.js' | relative_url | bust_file_cache }}"></script>
{%- endif -%}

{% if page.toc and page.toc.sidebar %}
  <!-- Sidebar Table of Contents -->
  <script defer src="{{ '/assets/js/bootstrap-toc.min.js' | relative_url | bust_file_cache }}"></script>
{% endif %}

  <!-- Bootstrap Table -->
  <script defer src="https://unpkg.com/bootstrap-table@{{ site.bootstrap-table.version }}/dist/bootstrap-table.min.js"></script>

  <!-- Load Common JS -->
  <script src="{{ '/assets/js/no_defer.js' | relative_url | bust_file_cache }}"></script>
  <script defer src="{{ '/assets/js/common.js' | relative_url | bust_file_cache }}"></script>
  <script defer src="{{ '/assets/js/copy_code.js' | relative_url | bust_file_cache }}" type="text/javascript"></script>

  <!-- Scroll Animations -->
  <script defer src="{{ '/assets/js/scroll-animations.js' | relative_url | bust_file_cache }}"></script>

  <!-- Particles.js Animated Background -->
  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Only initialize particles in dark mode
      function initParticles() {
        var theme = document.documentElement.getAttribute('data-theme');
        var particlesEl = document.getElementById('particles-js');

        if (theme === 'dark') {
          particlesEl.style.display = 'block';
          if (!window.pJSDom || window.pJSDom.length === 0) {
            // Choose config based on device type
            var configUrl = (window.MobileUtils && window.MobileUtils.isMobile()) ?
              '{{ '/assets/json/particles-mobile.json' | relative_url }}' :
              '{{ '/assets/json/particles.json' | relative_url }}';

            fetch(configUrl)
              .then(response => response.json())
              .then(config => {
                config.particles.color.value = '#ffffff';
                config.particles.line_linked.color = '#ffffff';
                particlesJS('particles-js', config);
              })
              .catch(error => console.error('Error loading particles config:', error));
          }
        } else {
          particlesEl.style.display = 'none';
          if (window.pJSDom && window.pJSDom.length > 0) {
            window.pJSDom[0].pJS.fn.vendors.destroypJS();
            window.pJSDom = [];
          }
        }
      }

      // Wait a bit for theme to be initialized, then check
      setTimeout(initParticles, 100);

      // Watch for theme changes
      var observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
          if (mutation.attributeName === 'data-theme') {
            initParticles();
          }
        });
      });
      observer.observe(document.documentElement, { attributes: true });
    });
  </script>
