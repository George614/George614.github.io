<header class="site-header">
  <div class="wrap header-bar">
    <a class="brand" href="/">{{ site.title }}</a>
    <nav class="site-nav" id="site-menu" aria-label="Main">
      <ul>
        {%- for item in site.data.nav %}
        <li><a href="{{ item.href }}"{% if page.nav_key == item.key %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {%- endfor %}
      </ul>
    </nav>
    <div class="header-tools">
      <button type="button" class="icon-button" data-theme-toggle aria-label="Switch theme">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6L19 19M5 19l1.4-1.4M17.6 6.4L19 5"/></svg>
      </button>
      <button type="button" class="icon-button menu-button" data-menu-toggle aria-expanded="false" aria-controls="site-menu" aria-label="Menu">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
</header>
