name: deploy

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

# Two runs never publish at the same time; a newer push waits for the deploy in progress.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ImageMagick and webp make the resized WebP copies; poppler-utils reads the CV PDF in a test.
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y imagemagick webp poppler-utils

      - name: Install npm packages
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps

      - name: Build the test site
        run: npm run build:test

      - name: Unit tests
        run: npm run test:unit

      - name: Browser tests
        run: npm run test:e2e

      - name: Build the production site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Site tests
        run: npm run test:site

      - name: Link check
        run: npm run check:links

      # Only the default branch publishes; pull requests and manual runs on other branches only test.
      - name: Deploy
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
